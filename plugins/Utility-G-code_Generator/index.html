<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8">

<title>Utility-G-code Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg, #0c1018);
  color: var(--text-primary, #e2e6f4);
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 300px; min-width: 280px;
  background: var(--surface, #151c28);
  border-right: 1px solid var(--border, #222840);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.section {
  border-bottom: 1px solid var(--border, #222840);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 5px;
}
.section-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-muted, #6a7898);
  margin-bottom: 2px;
}
label { color: var(--text-muted, #6a7898); font-size: 12px; margin-top: 2px; }
input[type=number], input[type=text], select {
  width: 100%;
  background: var(--elevated, #1a2235);
  border: 1px solid var(--border, #222840);
  border-radius: 4px;
  color: var(--text-primary, #e2e6f4);
  font-size: 13px; padding: 5px 8px; outline: none;
}
input:focus, select:focus { border-color: var(--accent, #f0a030); }
select { cursor: pointer; }
.mode-select {
  font-size: 14px !important;
  font-weight: 600;
  border-color: var(--accent, #f0a030) !important;
  padding: 8px !important;
}
.row2, .row3 {
  display: grid;
  gap: 6px;
  align-items: end;
}
.row2 { grid-template-columns: 1fr 1fr; }
.row3 { grid-template-columns: 1fr 1fr 1fr; }
.row2 > div,
.row3 > div {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-width: 0;
}
.row2 label,
.row3 label {
  margin-top: 0;
  line-height: 1.25;
  min-height: 2.5em;
  display: flex;
  align-items: flex-end;
}
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.main-split {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 2fr;
  min-height: 0;
  overflow: hidden;
}
.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.panel-left { border-right: 1px solid var(--border, #222840); }
.panel-header {
  flex-shrink: 0;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-muted, #6a7898);
  background: var(--surface, #151c28);
  border-bottom: 1px solid var(--border, #222840);
}
#gcode-output {
  flex: 1; width: 100%;
  background: var(--elevated, #1a2235);
  border: none; outline: none; resize: none;
  color: var(--text-primary, #e2e6f4);
  font-family: ui-monospace, monospace;
  font-size: 11px; line-height: 1.45;
  padding: 10px;
}
.viz-wrap {
  flex: 1;
  position: relative;
  background: #0a0e16;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.viz-pane {
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--border, #222840);
}
.viz-pane:last-child { border-bottom: none; }
.viz-pane canvas {
  flex: 1;
  width: 100%;
  min-height: 0;
  display: block;
}
.viz-pane-label {
  position: absolute;
  top: 4px; left: 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--text-muted, #6a7898);
  background: rgba(12,16,24,.7);
  padding: 1px 5px;
  border-radius: 3px;
  pointer-events: none;
  z-index: 2;
}
.viz-legend {
  position: absolute;
  left: 8px; bottom: 8px;
  font-size: 11px;
  color: var(--text-muted, #6a7898);
  background: rgba(12,16,24,.85);
  border: 1px solid var(--border, #222840);
  border-radius: 4px;
  padding: 6px 8px;
  pointer-events: none;
}
.viz-legend span { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 6px; }
.leg-rapid { border-top: 2px dashed #64748b; height: 0; }
.leg-cut { background: #f0a030; }
.leg-start { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
.leg-plunge { width: 6px; height: 6px; border-radius: 50%; background: #f0a030; }
.action-bar {
  padding: 8px 12px;
  background: var(--surface, #151c28);
  border-top: 1px solid var(--border, #222840);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.action-btn {
  padding: 7px 14px;
  background: var(--elevated, #1a2235);
  border: 1px solid var(--border, #222840);
  color: var(--text-primary, #e2e6f4);
  border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.action-btn:hover { border-color: var(--accent, #f0a030); }
.action-btn:disabled { opacity: .4; cursor: default; }
#status { font-size: 12px; color: var(--text-muted, #6a7898); flex: 1; text-align: right; }
#status.ok { color: #22c55e; }
#status.err { color: #ef4444; }
.hidden { display: none !important; }
@media (max-width: 900px) {
  .main-split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .panel-left { border-right: none; border-bottom: 1px solid var(--border, #222840); }
}
.language-section { padding-top: 8px; padding-bottom: 8px; }
.language-section select { font-weight: 600; }
</style>

function getLanguage() {
  return (typeof settingsCache !== "undefined" &&
          (settingsCache.language === "en" || settingsCache.language === "fr"))
    ? settingsCache.language : "fr";
}

function tr(key, vars = {}) {
  const lang = getLanguage();
  let text = I18N[lang]?.[key] ?? I18N.fr[key] ?? key;
  Object.entries(vars).forEach(([k, v]) => {
    text = text.replaceAll("{" + k + "}", String(v));
  });
  return text;
}

function isInches() {
  return (document.getElementById('global_units')?.value || 'mm') === 'in';
}

function unitize(text) {
  if (!isInches() || text == null) return text;
  return String(text)
    .replace(/\(mm\/min\)/gi, '(in/min)')
    .replace(/mm\/min/gi, 'in/min')
    .replace(/\(mm\)/gi, '(in)')
    .replace(/\ben mm\b/gi, 'en in')
    .replace(/\bin mm\b/gi, 'in inches')
    .replace(/, mm\b/gi, ', in')
    .replace(/\bmm\b/gi, 'in');
}

function applyLanguage() {
  const lang = getLanguage();
  document.documentElement.lang = lang;
  const selector = document.getElementById("language-select");
  if (selector) selector.value = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang]?.[key]) el.textContent = unitize(I18N[lang][key]);
  });
  applyTooltips();
}

function applyTooltips() {
  const lang = getLanguage();
  const pack = TOOLTIPS[lang] || TOOLTIPS.fr;
  const op = (document.getElementById('operation')?.value) || '1';
  const modeTips = pack.modes[op] || {};
  const commonTips = pack.common || {};
  for (const id of Object.keys(commonTips)) {
    const el = document.getElementById(id);
    if (el) el.title = unitize(commonTips[id]);
  }
  for (const id of Object.keys(modeTips)) {
    const el = document.getElementById(id);
    if (el) el.title = unitize(modeTips[id]);
  }
}

async function changeLanguage(lang) {
  settingsCache.language = (lang === "en") ? "en" : "fr";
  applyLanguage();
  try { await saveSettings(); } catch (_) {}
}

document.addEventListener("DOMContentLoaded", () => {
  const selector = document.getElementById("language-select");
  if (selector) {
    selector.addEventListener("change", () => changeLanguage(selector.value));
  }
  applyLanguage();
});
</script>

<script>
/* ========== FigUI bridge ========== */
let msgId = 0;
const pending = {};
function call(method, params) {
  return new Promise((resolve, reject) => {
    const id = String(++msgId);
    pending[id] = { resolve, reject };
    window.parent.postMessage({ type: 'fluid-request', id, method, params: params ?? {} }, '*');
  });
}
window.addEventListener('message', e => {
  if (e.data?.type === 'fluid-response') {
    const p = pending[e.data.id];
    if (p) {
      delete pending[e.data.id];
      e.data.error ? p.reject(new Error(e.data.error)) : p.resolve(e.data.result);
    }
  }
});

let generatedCode = '';

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = cls || '';
}
function num(id, def) {
  const el = document.getElementById(id);
  if (!el) return def;
  const v = parseFloat(el.value);
  return Number.isFinite(v) ? v : def;
}
function str(id) {
  const el = document.getElementById(id);
  return el ? (el.value || '').trim() : '';
}
function fmt(v) { return Number(v).toFixed(3); }
function showModePanel(op) {
  document.querySelectorAll('.mode-panel').forEach(el => el.classList.add('hidden'));
  const panel = document.getElementById('panel-' + op);
  if (panel) panel.classList.remove('hidden');
}

/* ========== Conversion mm ↔ in ========== */
const MM_PER_IN = 25.4;
const DIMENSION_HTML_IDS = [
  'start_x', 'start_y', 'start_z', 'clearance_height',
  'tool_diameter', 'feed_rate', 'depth_per_pass', 'total_depth',
  'width_x', 'length_y', 'hole_diameter', 'spacing_x', 'spacing_y',
  'radius', 'ob_length_x', 'ob_length_y', 'ob_width',
  'th_hole_diameter', 'thread_pitch'
];
const DIMENSION_JSON_KEYS = new Set([
  'start_x', 'start_y', 'start_z', 'clearance_height',
  'tool_diameter', 'feed_rate', 'depth_per_pass', 'total_depth',
  'width_x', 'length_y', 'hole_diameter', 'spacing_x', 'spacing_y',
  'radius', 'length_x', 'width', 'thread_pitch'
]);
let lastUnits = 'mm';

function roundConverted(n, toUnits) {
  if (!Number.isFinite(n)) return n;

  if (toUnits === 'in') {
    // 4 décimales
    return Math.round(n * 1e4) / 1e4;
  }

  // mm — 3 décimales, avec correction d'aller-retour
  // Erreur max due à 4 digits en pouces : 0.00005 × 25.4 ≈ 0.00127 mm
  const SNAP = 0.0013;
  for (let d = 0; d <= 3; d++) {
    const f = Math.pow(10, d);
    const candidate = Math.round(n * f) / f;
    if (Math.abs(n - candidate) <= SNAP) {
      return Math.round(candidate * 1e3) / 1e3;
    }
  }
  return Math.round(n * 1e3) / 1e3;
}

function convertAllDimensions(factor, toUnits) {
  for (const id of DIMENSION_HTML_IDS) {
    const el = document.getElementById(id);
    if (!el) continue;
    const v = parseFloat(el.value);
    if (!Number.isFinite(v)) continue;
    el.value = roundConverted(v * factor, toUnits);
  }
  for (const mk of [
    'surfacing', 'contour_drilling', 'matrix_drilling',
    'corner_radius', 'oblong_hole', 'threading'
  ]) {
    const section = settingsCache[mk];
    if (!section || typeof section !== 'object') continue;
    for (const key of Object.keys(section)) {
      if (!DIMENSION_JSON_KEYS.has(key)) continue;
      const v = section[key];
      if (typeof v === 'number' && Number.isFinite(v)) {
        section[key] = roundConverted(v * factor, toUnits);
      }
    }
  }
}

function applyUnitsChange(newUnits) {
  const oldUnits = lastUnits;
  if (newUnits === oldUnits) {
    applyLanguage();
    return;
  }
  captureMode(str('operation') || '1');
  let factor = 1;
  if (oldUnits === 'mm' && newUnits === 'in') factor = 1 / MM_PER_IN;
  else if (oldUnits === 'in' && newUnits === 'mm') factor = MM_PER_IN;
  if (factor !== 1) {
    convertAllDimensions(factor, newUnits);
    const op = str('operation') || '1';
    const map = MODE_MAP[op];
    if (map && settingsCache[map.key]) writeModeToForm(op, settingsCache[map.key]);
  }
  lastUnits = newUnits;
  settingsCache.global_units = newUnits;
  applyLanguage();
}

/* ========== Preview 2D ========== */
function parseWord(line, letter) {
  const re = new RegExp(letter + '([-+]?\\d*\\.?\\d+(?:[eE][-+]?\\d+)?)', 'i');
  const m = line.match(re);
  return m ? parseFloat(m[1]) : null;
}

function parseGCodePaths(gcode) {
  const segs = [];
  let x = 0, y = 0, z = 0;
  let abs = true;
  let startSet = false;
  let startX = 0, startY = 0, startZ = 0;
  const lines = String(gcode || '').split(/\r?\n/);
  const plunges = [];

  function toAbs(nx, ny, nz) {
    return {
      x: nx == null ? x : (abs ? nx : x + nx),
      y: ny == null ? y : (abs ? ny : y + ny),
      z: nz == null ? z : (abs ? nz : z + nz)
    };
  }
  function addLine(x0, y0, z0, x1, y1, z1, rapid) {
    if (x0 === x1 && y0 === y1 && z0 === z1) return;
    segs.push({ type: rapid ? 'rapid' : 'cut', x0, y0, z0, x1, y1, z1 });
    if (!rapid && x0 === x1 && y0 === y1 && z0 !== z1) {
      plunges.push({ x: x1, y: y1, z: z1 });
    }
  }
  function addArc(x0, y0, z0, x1, y1, z1, i, j, cw) {
    const cx = x0 + (i || 0);
    const cy = y0 + (j || 0);
    let a0 = Math.atan2(y0 - cy, x0 - cx);
    let a1 = Math.atan2(y1 - cy, x1 - cx);
    let da = a1 - a0;
    if (cw) {
      if (da > 0) da -= 2 * Math.PI;
      if (Math.abs(da) < 1e-9) da = -2 * Math.PI;
    } else {
      if (da < 0) da += 2 * Math.PI;
      if (Math.abs(da) < 1e-9) da = 2 * Math.PI;
    }
    const r = Math.hypot(x0 - cx, y0 - cy) || Math.hypot(x1 - cx, y1 - cy);
    const n = Math.max(8, Math.min(72, Math.ceil(Math.abs(da) / (Math.PI / 24))));
    let px = x0, py = y0, pz = z0;
    for (let k = 1; k <= n; k++) {
      const a = a0 + da * (k / n);
      const qx = cx + r * Math.cos(a);
      const qy = cy + r * Math.sin(a);
      const qz = z0 + (z1 - z0) * (k / n);
      segs.push({ type: 'cut', x0: px, y0: py, z0: pz, x1: qx, y1: qy, z1: qz });
      px = qx; py = qy; pz = qz;
    }
  }

  for (let raw of lines) {
    let line = raw.replace(/;.*$/, '').replace(/\(.*?\)/g, '').trim();
    if (!line) continue;
    if (/^G90\b/i.test(line)) { abs = true; continue; }
    if (/^G91\b/i.test(line)) { abs = false; continue; }
    const gMatch = line.match(/\bG0*(\d+)\b/i);
    const g = gMatch ? parseInt(gMatch[1], 10) : null;
    if (g == null && !/[XYZIJK]/i.test(line)) continue;
    const nx = parseWord(line, 'X');
    const ny = parseWord(line, 'Y');
    const nz = parseWord(line, 'Z');
    const ni = parseWord(line, 'I');
    const nj = parseWord(line, 'J');
    const p = toAbs(nx, ny, nz);
    if (!startSet && (nx != null || ny != null)) {
      startX = p.x; startY = p.y; startZ = p.z; startSet = true;
    }
    if (g === 0 || g === 00) {
      addLine(x, y, z, p.x, p.y, p.z, true);
      x = p.x; y = p.y; z = p.z;
    } else if (g === 1) {
      addLine(x, y, z, p.x, p.y, p.z, false);
      x = p.x; y = p.y; z = p.z;
    } else if (g === 2 || g === 3) {
      addArc(x, y, z, p.x, p.y, p.z, ni || 0, nj || 0, g === 2);
      x = p.x; y = p.y; z = p.z;
    } else if (nx != null || ny != null || nz != null) {
      if (nx != null || ny != null) {
        addLine(x, y, z, p.x, p.y, p.z, false);
        x = p.x; y = p.y;
      }
      z = p.z;
    }
  }
  return { segs, startX, startY, startZ, startSet, plunges };
}

function fmtL(v) {
  const a = Math.abs(v);
  if (a >= 100) return v.toFixed(1);
  return v.toFixed(2);
}

function drawView(canvas, segs, startA, startB, startSet, axisAKey, axisBKey, axisALabel, axisBLabel, w, h, pad, scale, minA, maxA, minB, maxB, toolDiameter, plungePoints) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0e16';
  ctx.fillRect(0, 0, w, h);
  if (!segs.length) {
    ctx.fillStyle = '#6a7898';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(tr('previewEmpty'), w / 2, h / 2);
    return;
  }
  const dA = Math.max(1e-6, maxA - minA);
  const dB = Math.max(1e-6, maxB - minB);
  const oA = (w - dA * scale) / 2 - minA * scale;
  const oB = (h + dB * scale) / 2 + minB * scale;
  function tA(a) { return oA + a * scale; }
  function tB(b) { return oB - b * scale; }
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(tA(minA), tB(0));
  ctx.lineTo(tA(maxA), tB(0));
  ctx.moveTo(tA(0), tB(minB));
  ctx.lineTo(tA(0), tB(maxB));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  ctx.strokeRect(tA(minA), tB(maxB), (maxA - minA) * scale, (maxB - minB) * scale);
  for (const s of segs) {
    const a0 = s[axisAKey + '0'], a1 = s[axisAKey + '1'];
    const b0 = s[axisBKey + '0'], b1 = s[axisBKey + '1'];
    if (a0 === a1 && b0 === b1) continue;
    ctx.beginPath();
    ctx.moveTo(tA(a0), tB(b0));
    ctx.lineTo(tA(a1), tB(b1));
    if (s.type === 'rapid') {
      ctx.strokeStyle = '#64748b';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
    } else {
      ctx.strokeStyle = '#f0a030';
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  if (plungePoints && plungePoints.length) {
    ctx.fillStyle = '#f0a030';
    for (const pt of plungePoints) {
      ctx.beginPath();
      ctx.arc(tA(pt[axisAKey]), tB(pt[axisBKey]), 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (startSet) {
    const toolRadiusPx = Math.max(2, ((toolDiameter || 0) / 2) * scale);
    const cx = tA(startA);
    const cy = tB(startB);
    const isXZ = (axisAKey === 'x' && axisBKey === 'z');
    if (isXZ) {
      const ww = toolRadiusPx * 2;
      const hh = toolRadiusPx * 6;
      ctx.beginPath();
      ctx.rect(cx - ww / 2, cy - hh / 2, ww, hh);
      ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
      ctx.fill();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#22c55e';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, toolRadiusPx, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
      ctx.fill();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#22c55e';
      ctx.fill();
    }
  }
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(tA(0), tB(0), 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = '10px ui-monospace, monospace';
  ctx.textBaseline = 'middle';
  function labelAt(a, b, text, anchor) {
    const px = tA(a), py = tB(b);
    let ax = 0, ay = 0;
    if (anchor === 'left') { ctx.textAlign = 'left'; ax = 5; }
    else if (anchor === 'right') { ctx.textAlign = 'right'; ax = -5; }
    else { ctx.textAlign = 'center'; }
    if (anchor === 'top') ay = -9;
    else if (anchor === 'bottom') ay = 11;
    else if (anchor === 'left' || anchor === 'right') ay = 0;
    else ay = -11;
    const tw = ctx.measureText(text).width;
    const bx = px + ax - (ctx.textAlign === 'center' ? tw / 2 : ctx.textAlign === 'right' ? tw : 0);
    const by = py + ay - 6;
    ctx.fillStyle = 'rgba(10,14,22,0.75)';
    ctx.fillRect(bx - 3, by, tw + 6, 12);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(text, px + ax, py + ay);
  }
  labelAt(0, 0, axisALabel + '0,' + axisBLabel + '0', 'bottom');
  labelAt(minA, (minB + maxB) / 2, axisALabel + 'min ' + fmtL(minA), 'right');
  labelAt(maxA, (minB + maxB) / 2, axisALabel + 'max ' + fmtL(maxA), 'left');
  labelAt((minA + maxA) / 2, minB, axisBLabel + 'min ' + fmtL(minB), 'top');
  labelAt((minA + maxA) / 2, maxB, axisBLabel + 'max ' + fmtL(maxB), 'bottom');
}

function computeTopPaneFraction(segs) {
  if (!segs.length) return 0.25;
  let minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const s of segs) {
    minY = Math.min(minY, s.y0, s.y1); maxY = Math.max(maxY, s.y0, s.y1);
    minZ = Math.min(minZ, s.z0, s.z1); maxZ = Math.max(maxZ, s.z0, s.z1);
  }
  minY = Math.min(minY, 0); maxY = Math.max(maxY, 0);
  minZ = Math.min(minZ, 0); maxZ = Math.max(maxZ, 0);
  const ySpan = Math.max(1e-6, maxY - minY);
  const zSpan = Math.max(1e-6, maxZ - minZ);
  let frac = zSpan / (zSpan + ySpan);
  return Math.min(0.45, Math.max(0.18, frac));
}

let lastToolDiameter = 10;

function drawPreview(gcode, toolDiameter) {
  if (toolDiameter != null) lastToolDiameter = toolDiameter;
  const td = lastToolDiameter;
  const { segs, startX, startY, startZ, startSet, plunges } = parseGCodePaths(gcode);
  const paneXZ = document.getElementById('viz-pane-xz');
  const paneXY = document.getElementById('viz-pane-xy');
  const frac = computeTopPaneFraction(segs);
  paneXZ.style.flex = frac + ' 1 0%';
  paneXY.style.flex = (1 - frac) + ' 1 0%';
  const canvasXZ = document.getElementById('preview-canvas-xz');
  const canvasXY = document.getElementById('preview-canvas-xy');
  const wXZ = Math.max(30, canvasXZ.parentElement.clientWidth);
  const hXZ = Math.max(30, canvasXZ.parentElement.clientHeight);
  const wXY = Math.max(30, canvasXY.parentElement.clientWidth);
  const hXY = Math.max(30, canvasXY.parentElement.clientHeight);
  const pad = 24;
  if (!segs.length) {
    drawView(canvasXZ, segs, 0, 0, false, 'x', 'z', 'X', 'Z', wXZ, hXZ, pad, 1, 0, 1, 0, 1, td);
    drawView(canvasXY, segs, 0, 0, false, 'x', 'y', 'X', 'Y', wXY, hXY, pad, 1, 0, 1, 0, 1, td);
    return;
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const s of segs) {
    minX = Math.min(minX, s.x0, s.x1); maxX = Math.max(maxX, s.x0, s.x1);
    minY = Math.min(minY, s.y0, s.y1); maxY = Math.max(maxY, s.y0, s.y1);
    minZ = Math.min(minZ, s.z0, s.z1); maxZ = Math.max(maxZ, s.z0, s.z1);
  }
  if (startSet) {
    minX = Math.min(minX, startX); maxX = Math.max(maxX, startX);
    minY = Math.min(minY, startY); maxY = Math.max(maxY, startY);
    minZ = Math.min(minZ, startZ); maxZ = Math.max(maxZ, startZ);
  }
  minX = Math.min(minX, 0); maxX = Math.max(maxX, 0);
  minY = Math.min(minY, 0); maxY = Math.max(maxY, 0);
  minZ = Math.min(minZ, 0); maxZ = Math.max(maxZ, 0);
  const dX = Math.max(1e-6, maxX - minX);
  const dY = Math.max(1e-6, maxY - minY);
  const dZ = Math.max(1e-6, maxZ - minZ);
  const scale = Math.min(
    (wXZ - 2 * pad) / dX, (hXZ - 2 * pad) / dZ,
    (wXY - 2 * pad) / dX, (hXY - 2 * pad) / dY
  );
  drawView(canvasXZ, segs, startX, startZ, startSet, 'x', 'z', 'X', 'Z', wXZ, hXZ, pad, scale, minX, maxX, minZ, maxZ, td);
  drawView(canvasXY, segs, startX, startY, startSet, 'x', 'y', 'X', 'Y', wXY, hXY, pad, scale, minX, maxX, minY, maxY, td, plunges);
}

function parseFieldValue(el) {
  const v = el.value;
  if (el.tagName === 'SELECT' || el.type === 'text') return v;
  const n = parseFloat(v);
  return (v !== '' && Number.isFinite(n)) ? n : v;
}
function readModeFromForm(op) {
  const map = MODE_MAP[op];
  if (!map) return {};
  const obj = {};
  for (const [htmlId, jsonKey] of Object.entries(map.fields)) {
    const el = document.getElementById(htmlId);
    if (el) obj[jsonKey] = parseFieldValue(el);
  }
  return obj;
}
function writeModeToForm(op, section) {
  const map = MODE_MAP[op];
  if (!map || !section) return;
  for (const [htmlId, jsonKey] of Object.entries(map.fields)) {
    const el = document.getElementById(htmlId);
    if (el && section[jsonKey] !== undefined && section[jsonKey] !== null) el.value = section[jsonKey];
  }
}
function captureMode(op) {
  const map = MODE_MAP[op];
  if (!map) return;
  settingsCache[map.key] = readModeFromForm(op);
  settingsCache.last_operation = op;
  settingsCache.project_name = str('project_name') || 'test';
  settingsCache.machine = str('machine') || 'CNC';
  settingsCache.global_units = str('global_units') || 'mm';
  settingsCache.global_feed_rate_percent = (str('plunge_percent') || '50') + '%';
  settingsCache.startup_codes = str('startup_codes') || 'M7 M8 M3 G04P5';
}
async function saveSettings() {
  captureMode(str('operation') || '1');
  try {
    await call('saveSettings', { data: settingsCache });
    return true;
  } catch (e) {
    setStatus('Settings: ' + (e.message || e), 'err');
    return false;
  }
}
async function loadSettings() {
  try {
    const s = await call('getSettings');
    if (s && typeof s === 'object') {
      if (s.language === 'fr' || s.language === 'en') settingsCache.language = s.language;
      if (s.surfacing || s.threading || s.last_operation) Object.assign(settingsCache, s);
      else {
        const op = String(s.operation || '1');
        settingsCache.last_operation = op;
        settingsCache.project_name = s.project_name || settingsCache.project_name;
        settingsCache.machine = s.machine || settingsCache.machine;
        settingsCache.global_units = s.global_units || 'mm';
        if (s.plunge_percent !== undefined) settingsCache.global_feed_rate_percent = String(s.plunge_percent).replace('%','') + '%';
        if (s.startup_codes !== undefined) settingsCache.startup_codes = s.startup_codes;
        const map = MODE_MAP[op];
        if (map) {
          const section = {};
          for (const [htmlId, jsonKey] of Object.entries(map.fields)) {
            if (s[htmlId] !== undefined) {
              const n = parseFloat(s[htmlId]);
              section[jsonKey] = Number.isFinite(n) && document.getElementById(htmlId)?.tagName !== 'SELECT' ? n : s[htmlId];
            }
          }
          settingsCache[map.key] = section;
        }
      }
    }
  } catch (_) {}
  const op = String(settingsCache.last_operation || '1');
  document.getElementById('operation').value = op;
  document.getElementById('project_name').value = settingsCache.project_name || 'test';
  document.getElementById('machine').value = settingsCache.machine || 'CNC';
  lastUnits = settingsCache.global_units || 'mm';
  document.getElementById('global_units').value = lastUnits;
  document.getElementById('plunge_percent').value = String(settingsCache.global_feed_rate_percent || '50%').replace('%','').trim() || '50';
  document.getElementById('startup_codes').value = settingsCache.startup_codes || 'M7 M8 M3 G04P5';
  showModePanel(op);
  const map = MODE_MAP[op];
  if (map && settingsCache[map.key]) writeModeToForm(op, settingsCache[map.key]);
  setStatus(tr('settingsLoaded'), 'ok');
}

function expandStartupCodes(raw, spindleSpeed) {
  let s = String(raw || '').trim();
  s = s.replace(/\bG0*4\s*P\s*([-+]?\d*\.?\d+)/gi, 'G04§P$1');
  const tokens = s.split(/\s+/).filter(Boolean);
  const lines = [];
  for (const tok of tokens) {
    let code = tok.replace('§', ' ');
    if (/^M0*3$/i.test(code)) {
      code = code + ' S' + Math.round(spindleSpeed);
    }
    lines.push(code);
  }
  return lines;
}

function generateHeader(p, stockX, stockY, stockZ) {
  const now = new Date().toISOString().replace('T', ' ').slice(0, 19);
  const units = p.global_units === 'in' ? 'G20' : 'G21';
  const startupLines = expandStartupCodes(p.startup_codes, p.spindle_speed);
  return [
    '; NC from Utility-G-code Generator (FigUI)',
    '; ' + p.project_name, '; ' + now, '; ' + p.machine,
    `; (${fmt(stockX)}, ${fmt(stockY)}, ${fmt(stockZ)} ${p.global_units})`,
    `${units} ;(${p.global_units})`, 'G90',
    ...startupLines,
    ''
  ].join('\n');
}
function footer(clearance) {
  return [`G00 Z${fmt(clearance)}`, 'G90', 'M5', 'M30'].join('\n');
}

function genSurfacing(p) {
  const pathCode = { conventional: '1', climb: '2', alternate: '3' }[p.path_type] || '1';
  const labels = { conventional: 'Opposition', climb: 'Avalant', alternate: 'Alterné' };
  // --- genSurfacing ---
  if (p.depth_per_pass > p.total_depth) throw new Error(tr('depthPassError'));
  if (p.overlap_percent < 0 || p.overlap_percent >= 100) throw new Error(tr('overlapRangeError'));
  const stepOver = p.tool_diameter * (1 - p.overlap_percent / 100);
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const numPassesY = Math.ceil(p.length_y / stepOver);
  const offset = p.tool_diameter / 2;
  const initialX = p.start_x - offset, initialY = p.start_y - offset;
  const endX = p.start_x + p.width_x, endY = p.start_y + p.length_y;
  const plunge = p.feed_rate * p.plunge_percent / 100;
  let g = [];
  g.push(`; Surfacing (${labels[p.path_type] || 'Opposition'})`);
  g.push(`G01 Z${fmt(p.clearance_height)} S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  if (pathCode === '2') g.push(`G01 X${fmt(initialX)} Y${fmt(endY)}`);
  else g.push(`G01 X${fmt(initialX)} Y${fmt(initialY)}`);
  let currentZ = p.start_z;
  for (let i = 0; i < numPassesZ; i++) {
    currentZ -= Math.min(p.depth_per_pass, p.total_depth - i * p.depth_per_pass);
    g.push(`; Pass ${i + 1} at Z=${fmt(currentZ)}`);
    g.push(`G01 Z${fmt(currentZ)} F${fmt(plunge)}`);
    let currentY = initialY;
    for (let j = 0; j < numPassesY; j++) {
      if (currentY > p.start_y + p.length_y) break;
      if (pathCode === '3') {
        g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
        g.push(j % 2 === 0 ? `G01 X${fmt(endX)} F${Math.round(p.feed_rate)}` : `G01 X${fmt(p.start_x)} F${Math.round(p.feed_rate)}`);
      } else if (pathCode === '2') {
        g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
        g.push(`G01 X${fmt(p.start_x)} F${Math.round(p.feed_rate)}`);
        if (currentY + stepOver <= p.start_y + p.length_y) g.push(`G00 X${fmt(endX)}`);
      } else {
        g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
        g.push(`G01 X${fmt(endX)} F${Math.round(p.feed_rate)}`);
        if (currentY + stepOver <= p.start_y + p.length_y) g.push(`G00 X${fmt(p.start_x)}`);
      }
      currentY += stepOver;
    }
    if (currentY <= p.start_y + p.length_y) g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
  }
  g.push(`G00 Z${fmt(p.clearance_height)}`);

    // --- Tour de finition sur les 4 faces (décalage = rayon outil) ---
  const toolR = p.tool_diameter / 2;
  const xMin = p.start_x - toolR;
  const xMax = p.start_x + p.width_x + toolR;
  const yMin = p.start_y - toolR;
  const yMax = p.start_y + p.length_y + toolR;
  const finalZ = currentZ;
  const feed = Math.round(p.feed_rate);

  g.push('; Perimeter finish (tool radius offset)');
  g.push(`G00 Z${fmt(p.clearance_height)}`);
  g.push(`G00 X${fmt(xMin)} Y${fmt(yMin)}`);
  g.push(`G01 Z${fmt(finalZ)} F${fmt(plunge)}`);

  if (pathCode === '1') {
    // Opposition → horaire (CW)
    g.push(`G01 X${fmt(xMax)} Y${fmt(yMin)} F${feed}`);
    g.push(`G01 X${fmt(xMax)} Y${fmt(endY)} F${feed}`);
    g.push(`G01 X${fmt(xMin)} Y${fmt(endY)} F${feed}`);
    g.push(`G01 X${fmt(xMin)} Y${fmt(yMin)} F${feed}`);
  } else if (pathCode === '2')  {
    // Avalant / Alterné → anti-horaire (CCW)
    g.push(`G01 X${fmt(xMax)} Y${fmt(yMin)} F${feed}`);
    g.push(`G01 X${fmt(xMax)} Y${fmt(endY)} F${feed}`);
    g.push(`G01 X${fmt(xMin)} Y${fmt(endY)} F${feed}`);
    g.push(`G0 X${fmt(xMin)} Y${fmt(yMin)} Z${fmt(p.clearance_height)}`);
  } else {
    // Avalant / Alterné → anti-horaire (CCW)
    g.push(`G01 X${fmt(xMin)} Y${fmt(endY)} F${feed}`);
    g.push(`G01 X${fmt(xMax)} Y${fmt(endY)} F${feed}`);
    g.push(`G01 X${fmt(xMax)} Y${fmt(yMin)} F${feed}`);
    g.push(`G01 X${fmt(xMin)} Y${fmt(yMin)} F${feed}`);
  }

  g.push(`G00 Z${fmt(p.clearance_height)}`);
  return {
    body: g.join('\n'),
    stockX: p.width_x + p.tool_diameter,
    stockY: p.length_y + p.tool_diameter,
    stockZ: p.total_depth + p.clearance_height
  };
}

function genContour(p) {
  if (p.hole_diameter <= p.tool_diameter) throw new Error(tr('holeMustBeLarger'));
  if (p.depth_per_pass > p.total_depth) throw new Error(tr('depthPassError'));
  const isBlind = p.drilling_type === 'blind';
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const holeR = p.hole_diameter / 2, toolR = p.tool_diameter / 2;
  let circleR, numCircles, stepOver = 0;
  if (p.drilling_type === 'outer') { circleR = holeR + toolR; numCircles = 1; }
  else {
    circleR = holeR - toolR;
    if (isBlind) {
      stepOver = p.tool_diameter * (1 - p.overlap_percent / 100);
      numCircles = Math.floor((holeR - toolR) / stepOver) + 1;
    } else numCircles = 1;
  }
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const pathIsConv = p.path_type === 'conventional';
  let g = [];
  g.push('; Contour drilling');
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
  let currentZ = p.start_z;
  for (let i = 0; i < numPassesZ; i++) {
    currentZ -= Math.min(p.depth_per_pass, p.total_depth - i * p.depth_per_pass);
    g.push(`; Pass ${i + 1} at Z=${fmt(currentZ)}`);
    for (let j = 0; j < numCircles; j++) {
      let r = isBlind ? circleR - j * stepOver : circleR;
      if (isBlind && r < toolR) r = toolR;
      const tx = p.start_x + r;
      g.push(`G00 X${fmt(tx)} Y${fmt(p.start_y)}`);
      g.push(`G01 Z${fmt(currentZ)} F${fmt(plunge)}`);
      g.push(pathIsConv
        ? `G02 X${fmt(tx)} Y${fmt(p.start_y)} I${fmt(-r)} J0.000 F${Math.round(p.feed_rate)}`
        : `G03 X${fmt(tx)} Y${fmt(p.start_y)} I${fmt(-r)} J0.000 F${Math.round(p.feed_rate)}`);
    }
  }
  g.push(`G00 Z${fmt(p.clearance_height)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
  const stock = p.drilling_type === 'outer' ? p.hole_diameter + 2 * p.tool_diameter : p.hole_diameter + p.tool_diameter;
  return { body: g.join('\n'), stockX: stock, stockY: stock, stockZ: p.total_depth + p.clearance_height };
}

function genMatrix(p) {
  if (p.num_cols < 1 || p.num_rows < 1) throw new Error(tr('colsRowsError'));
  if (p.depth_per_pass > p.total_depth) throw new Error(tr('depthPassError'));
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const approachOffset = 1;
  let g = [];
  g.push('; Matrix drilling RAST');
  g.push(`; ${p.num_cols} x ${p.num_rows} holes`);
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
  for (let j = 0; j < p.num_rows; j++) {
    const cy = p.start_y + j * p.spacing_y;
    let xs = [];
    for (let i = 0; i < p.num_cols; i++) xs.push(p.start_x + i * p.spacing_x);
    if (j % 2 === 1) xs.reverse();
    for (const cx of xs) {
      g.push(`; Hole X=${fmt(cx)} Y=${fmt(cy)}`);
      g.push(`G00 X${fmt(cx)} Y${fmt(cy)}`);
      let currentZ = p.start_z;
      let prevZ = p.start_z;
      for (let k = 0; k < numPassesZ; k++) {
        currentZ -= Math.min(p.depth_per_pass, p.total_depth - k * p.depth_per_pass);
        if (k > 0) g.push(`G00 Z${fmt(prevZ + approachOffset)}`);
        g.push(`G01 Z${fmt(currentZ)} F${fmt(plunge)}`);
        prevZ = currentZ;
        if (k < numPassesZ - 1) g.push(`G00 Z${fmt(p.clearance_height)}`);
      }
      g.push(`G00 Z${fmt(p.clearance_height)}`);
    }
  }
  return {
    body: g.join('\n'),
    stockX: p.num_cols > 1 ? (p.num_cols - 1) * p.spacing_x : 10,
    stockY: p.num_rows > 1 ? (p.num_rows - 1) * p.spacing_y : 10,
    stockZ: p.total_depth + p.clearance_height
  };
}

function genCorner(p) {
  if (p.radius <= 0 || p.tool_diameter <= 0) throw new Error(tr('radiusToolError'));
  if (p.depth_per_pass > p.total_depth) throw new Error(tr('depthPassError'));
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const arcR = p.radius + p.tool_diameter / 2;
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const conv = p.path_type !== 'conventional';
  let arcCmd, returnX, returnY;
  if (p.corner_type === 'front_left') {
    if (conv) { arcCmd = `G03 X${fmt(arcR)} Y-${fmt(arcR)} I${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
    else { arcCmd = `G02 X-${fmt(arcR)} Y${fmt(arcR)} I0.000 J${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
  } else if (p.corner_type === 'front_right') {
    if (conv) { arcCmd = `G03 X${fmt(arcR)} Y${fmt(arcR)} I0.000 J${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
    else { arcCmd = `G02 X-${fmt(arcR)} Y-${fmt(arcR)} I-${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
  } else if (p.corner_type === 'rear_right') {
    if (conv) { arcCmd = `G03 X-${fmt(arcR)} Y${fmt(arcR)} I-${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
    else { arcCmd = `G02 X${fmt(arcR)} Y-${fmt(arcR)} I0.000 J-${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
  } else {
    if (conv) { arcCmd = `G03 X-${fmt(arcR)} Y-${fmt(arcR)} I0.000 J-${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
    else { arcCmd = `G02 X${fmt(arcR)} Y${fmt(arcR)} I${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
  }
  let g = [];
  g.push('; Corner radius 90°');
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push('G91');
  for (let i = 0; i < numPassesZ; i++) {
    const depth = Math.min(p.depth_per_pass, p.total_depth - i * p.depth_per_pass);
    const targetZ = p.start_z - (i * p.depth_per_pass + depth);
    g.push(`; Pass ${i + 1} at Z=${fmt(targetZ)}`);
    g.push('G90');
    g.push(`G01 Z${fmt(targetZ)} F${fmt(plunge)}`);
    g.push('G91');
    g.push(arcCmd);
    g.push('G90');
    g.push(`G00 Z${fmt(p.clearance_height)}`);
    if (i < numPassesZ - 1) { g.push('G91'); g.push(returnX); g.push(returnY); }
  }
  return { body: g.join('\n'), stockX: arcR * 2, stockY: arcR * 2, stockZ: p.clearance_height + p.total_depth };
}

function genOblong(p) {
  if (p.width < p.tool_diameter) throw new Error(tr('widthToolError'));
  if (p.depth_per_pass > p.total_depth) throw new Error(tr('depthPassError'));
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const halfW = (p.width - p.tool_diameter) / 2, halfLx = p.length_x / 2, halfLy = p.length_y / 2;
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const conv = p.path_type === 'conventional';
  let g = [];
  g.push('; Oblong hole');
  g.push('G90');
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}  F${Math.round(p.feed_rate)}`);
  for (let i = 0; i < numPassesZ; i++) {
    const targetZ = p.start_z - Math.min((i + 1) * p.depth_per_pass, p.total_depth);
    g.push(`; Pass ${i + 1} at Z=${fmt(targetZ)}`);
    if (conv) {
      g.push('G90');
      g.push(`G01 X${fmt(p.start_x)} Y${fmt(p.start_y - halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 Z${fmt(targetZ)} F${fmt(plunge)}`);
      g.push('G91');
      g.push(`G01 X${fmt(-halfLx)} Y${fmt(-halfLy)}`);
      g.push(`G02 X${fmt(-halfW)} Y${fmt(halfW)} I0.000 J${fmt(halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G02 X${fmt(halfW)} Y${fmt(halfW)} I${fmt(halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G02 X${fmt(halfW)} Y${fmt(-halfW)} I0.000 J${fmt(-halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(-p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G02 X${fmt(-halfW)} Y${fmt(-halfW)} I${fmt(-halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(-p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push('G90');
    } else {
      g.push('G90');
      g.push(`G01 X${fmt(p.start_x - halfW)} Y${fmt(p.start_y - p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 Z${fmt(targetZ)} F${fmt(plunge)}`);
      g.push('G91');
      g.push(`G01 X${fmt(-halfLx)} Y${fmt(halfLy)}`);
      g.push(`G03 X${fmt(halfW)} Y${fmt(-halfW)} I${fmt(halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G03 X${fmt(halfW)} Y${fmt(halfW)} I0.000 J${fmt(halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G03 X${fmt(-halfW)} Y${fmt(halfW)} I${fmt(-halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(-p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G03 X${fmt(-halfW)} Y${fmt(-halfW)} I0.000 J${fmt(-halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(-p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push('G90');
    }
  }
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}  F${Math.round(p.feed_rate)}`);
  g.push('G90');
  return { body: g.join('\n'), stockX: p.length_x + p.tool_diameter, stockY: p.length_y + p.tool_diameter, stockZ: p.start_z + p.total_depth };
}

function genThreading(p) {
  if (p.hole_diameter <= p.tool_diameter) throw new Error(tr('holeToolError'));
  if (p.thread_pitch <= 0 || p.thread_number <= 0) throw new Error(tr('pitchThreadError'));
  const numRadial = Math.ceil(p.total_depth / p.depth_per_pass);
  const holeR = p.hole_diameter / 2, toolR = p.tool_diameter / 2;
  const arcCode = p.path_type === 'left' ? 'G03' : 'G02';
  const isNut = p.thread_type === 'nut_internal';
  let g = [];
  g.push('; Threading');
  g.push(`G00 Z${fmt(p.clearance_height)} S${Math.round(p.spindle_speed)}`);
  if (isNut) {
    const baseX = holeR - p.depth_per_pass - toolR - p.total_depth;
    g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
    for (let pass = 1; pass <= numRadial; pass++) {
      const currentX = baseX + (pass + 1) * p.depth_per_pass;
      g.push(`G01 X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)}`);
      for (let turn = 1; turn <= p.thread_number; turn++) {
        g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000 Z${fmt(p.start_z - p.thread_pitch * turn)}`);
      }
      g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000`);
      g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
      if (pass < numRadial) g.push(`G00 Z${fmt(p.start_z)}`);
    }
  } else {
    const baseX = holeR - p.depth_per_pass + toolR;
    const retractX = p.start_x + holeR + toolR + p.total_depth;
    g.push(`G00 X${fmt(retractX)} Y${fmt(p.start_y)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
    for (let pass = 1; pass <= numRadial; pass++) {
      const currentX = baseX - pass * p.depth_per_pass + p.depth_per_pass;
      g.push(`G01 X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)}`);
      for (let turn = 1; turn <= p.thread_number; turn++) {
        g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000 Z${fmt(p.start_z - p.thread_pitch * turn)}`);
      }
      g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000`);
      g.push(`G00 X${fmt(retractX)} Y${fmt(p.start_y)}`);
      if (pass < numRadial) g.push(`G00 Z${fmt(p.start_z)}`);
    }
  }
  g.push(`G00 Z${fmt(p.clearance_height)}`);
  const stock = p.hole_diameter + p.tool_diameter;
  return { body: g.join('\n'), stockX: stock, stockY: stock, stockZ: p.total_depth + p.clearance_height };
}

function collectParams() {
  const op = str('operation');
  const base = {
    operation: op,
    project_name: str('project_name') || 'test',
    machine: str('machine') || 'CNC',
    global_units: str('global_units') || 'mm',
    plunge_percent: Math.min(100, Math.max(1, num('plunge_percent', 50))),
    startup_codes: str('startup_codes') || 'M7 M8 M3 G04P5',
    start_x: num('start_x', 0), start_y: num('start_y', 0), start_z: num('start_z', 0),
    clearance_height: Math.max(0.1, num('clearance_height', 5)),
    tool_diameter: Math.max(0.1, num('tool_diameter', 10)),
    spindle_speed: Math.max(0, num('spindle_speed', 1000)),
    feed_rate: Math.max(1, num('feed_rate', 1800)),
    depth_per_pass: Math.max(0.01, num('depth_per_pass', 1)),
    total_depth: Math.max(0.01, num('total_depth', 2))
  };
  if (op === '1') return { ...base, width_x: Math.max(0.1, num('width_x', 100)), length_y: Math.max(0.1, num('length_y', 100)), overlap_percent: Math.min(99, Math.max(0, num('overlap_percent', 50))), path_type: str('path_type_surf') || 'conventional' };
  if (op === '2') return { ...base, hole_diameter: Math.max(0.1, num('hole_diameter', 30)), drilling_type: str('drilling_type') || 'contour', path_type: str('path_type_contour') || 'conventional', overlap_percent: Math.min(99, Math.max(0, num('overlap_blind', 50))) };
  if (op === '3') return { ...base, num_cols: Math.max(1, Math.round(num('num_cols', 1))), num_rows: Math.max(1, Math.round(num('num_rows', 1))), spacing_x: Math.max(0, num('spacing_x', 10)), spacing_y: Math.max(0, num('spacing_y', 10)) };
  if (op === '4') return { ...base, radius: Math.max(0.1, num('radius', 10)), corner_type: str('corner_type') || 'front_left', path_type: str('path_type_corner') || 'conventional' };
  if (op === '5') return { ...base, length_x: Math.max(0, num('ob_length_x', 20)), length_y: Math.max(0, num('ob_length_y', 20)), width: Math.max(0.1, num('ob_width', 10)), path_type: str('path_type_oblong') || 'conventional' };
  if (op === '6') return { ...base, hole_diameter: Math.max(0.1, num('th_hole_diameter', 30)), thread_type: str('thread_type') || 'nut_internal', path_type: str('path_type_thread') || 'right', thread_pitch: Math.max(0.01, num('thread_pitch', 1.5)), thread_number: Math.max(1, Math.round(num('thread_number', 6))) };
  return base;
}

async function generate() {
  try {
    const p = collectParams();
    let result;
    switch (p.operation) {
      case '1': result = genSurfacing(p); break;
      case '2': result = genContour(p); break;
      case '3': result = genMatrix(p); break;
      case '4': result = genCorner(p); break;
      case '5': result = genOblong(p); break;
      case '6': result = genThreading(p); break;
      default: throw new Error('Mode inconnu');
    }
    generatedCode = generateHeader(p, result.stockX, result.stockY, result.stockZ) + '\n' + result.body + '\n' + footer(p.clearance_height);
    document.getElementById('gcode-output').value = generatedCode;
    document.getElementById('open-btn').disabled = false;
    requestAnimationFrame(() => drawPreview(generatedCode, p.tool_diameter));
    const ok = await saveSettings();
    setStatus(ok ? tr('gcodeGeneratedPreviewOk') : tr('gcodeGeneratedSettingsError'), ok ? 'ok' : 'err');
  } catch (e) {
    setStatus(e.message || String(e), 'err');
  }
}

async function openInViewer() {
  if (!generatedCode) { setStatus(tr('generateFirst'), 'err'); return; }
  const p = collectParams();
  const safe = (p.project_name || 'test').replace(/[<>:"/\\|?*]/g, '_');
  const names = { '1': 'surf', '2': 'contour', '3': 'matrix', '4': 'corner', '5': 'oblong', '6': 'thread' };
  const path = `/sd/${names[p.operation] || 'op'}_${safe}.nc`;
  try {
    await saveSettings();
    setStatus(tr('saving'), '');
    await call('writeFile', { path, content: generatedCode, fs: 'sd' });
    let loaded = false;
    for (const t of [
      { method: 'loadFile', params: { path, fs: 'sd' } },
      { method: 'openFile', params: { path, fs: 'sd' } },
      { method: 'loadGcode', params: { path, fs: 'sd' } },
      { method: 'previewFile', params: { path, fs: 'sd' } }
    ]) {
      try { await call(t.method, t.params); loaded = true; break; } catch (_) {}
    }
    setStatus(loaded ? tr('loadedInViewer') : tr('savedOpenFiles', { path }), 'ok');
    setTimeout(() => { try { call('close'); } catch (_) {} }, 400);
  } catch (e) {
    setStatus(tr('error', { message: (e.message || e) }), 'err');
  }
}

loadSettings().finally(() => { applyLanguage(); generate(); });
</script>
